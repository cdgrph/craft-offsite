name: CI
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  engine-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix: { php: ['8.2', '8.3'] }
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with: { php-version: '${{ matrix.php }}', extensions: 'zip, curl, intl' }
      - run: composer install --no-interaction --prefer-dist
      - run: vendor/bin/phpunit --testsuite engine,functional
  integration-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      # minio/minio is no longer published on Docker Hub, so the tests run
      # against RustFS, an S3-compatible server (rustfs/rustfs:1.0.1)
      - run: docker run -d -p 9000:9000 -e RUSTFS_ACCESS_KEY=offsite -e RUSTFS_SECRET_KEY=offsite-secret rustfs/rustfs@sha256:1803faef57627e2d9c2e7d89d655d712ddded5389040054987163043fecb6a3c
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with: { php-version: '8.3', extensions: 'zip, curl, intl' }
      - run: composer install --no-interaction --prefer-dist
      - run: OFFSITE_TEST_S3=1 vendor/bin/phpunit --testsuite integration
